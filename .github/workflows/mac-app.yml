# Buduje aplikację Task Hub na Maca (instalator .pkg i obraz .dmg) i publikuje ją jako wydanie na GitHubie.
# Wersja siedzi w macos/VERSION. Push do main z nową wersją daje właściwe wydanie app-v<wersja> (tag tworzy sam GitHub,
# bo push tagów z sesji w chmurze jest zablokowany); kolejne pushe z tą samą wersją odświeżają wydanie wstępne „app-latest”.
# Na właściwe wydanie wskazuje https://github.com/piotr-bialobrzeski-wrx/taskhub/releases/latest (link w Ustawieniach Task Hub).
name: mac-app

on:
  push:
    branches: [main]
    tags: ["app-v*"]
    paths: ["macos/**", ".github/workflows/mac-app.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mac-app-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Wersja
        id: v
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER="$(tr -d ' \n\r' < macos/VERSION)"
          if [[ "$GITHUB_REF" == refs/tags/app-v* ]]; then
            echo "version=${GITHUB_REF#refs/tags/app-v}" >> "$GITHUB_OUTPUT"
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
            echo "pre=false" >> "$GITHUB_OUTPUT"
          elif gh release view "app-v$VER" >/dev/null 2>&1; then
            # ta wersja jest już wydana: budowa robocza jako wydanie wstępne app-latest
            echo "version=$VER-b${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
            echo "tag=app-latest" >> "$GITHUB_OUTPUT"
            echo "pre=true" >> "$GITHUB_OUTPUT"
          else
            # nowa wersja w macos/VERSION: właściwe wydanie app-v<wersja> (tag tworzy gh release create)
            echo "version=$VER" >> "$GITHUB_OUTPUT"
            echo "tag=app-v$VER" >> "$GITHUB_OUTPUT"
            echo "pre=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Budowa
        run: |
          mkdir -p macos/out
          set -o pipefail
          macos/build.sh "${{ steps.v.outputs.version }}" "${GITHUB_RUN_NUMBER}" 2>&1 | tee macos/out/build.log

      - name: Zgłoś błąd budowy jako komentarz do commita
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          { echo '### Budowa aplikacji na Maca nie powiodła się'; echo; echo '```'; tail -c 6000 macos/out/build.log 2>/dev/null || echo '(brak dziennika)'; echo '```'; } > macos/out/comment.md
          gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/comments" -F body=@macos/out/comment.md >/dev/null || true

      - name: Wydanie
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.v.outputs.tag }}
          VERSION: ${{ steps.v.outputs.version }}
          PRE: ${{ steps.v.outputs.pre }}
        run: |
          cat > macos/out/notes.md <<'EOF'
          Aplikacja Task Hub na Maca (macOS 13 lub nowszy, Apple Silicon i Intel): okno z Task Hub, ikona w pasku menu,
          szybki pasek (domyślnie ⌥Spacja) i mostek, który uruchamia Claude Code na tym Macu, gdy tylko pojawi się praca.

          **Instalacja**
          1. Pobierz `Task-Hub-<wersja>.pkg` i otwórz go. Jeśli macOS powie, że nie może sprawdzić dewelopera: Ustawienia systemowe → Prywatność i ochrona → „Otwórz mimo to”.
          2. Aplikacja trafia do /Applications (Launchpad, Spotlight).
          3. Zainstaluj Claude Code i zaloguj się raz w Terminalu: `claude`, potem `/login`.
          4. W Task Hub (przeglądarka) → Ustawienia → Mostek na komputerze → utwórz token → „Połącz aplikację Task Hub na tym Macu”.

          Kolejne wersje aplikacja pobiera i instaluje sama (plik `.zip`), bez ponownego przechodzenia przez ten krok.
          EOF
          # suma kontrolna obok .zip i .pkg (plik <nazwa>.sha256): aktualizacja w aplikacji sprawdza ją przed rozpakowaniem
          for f in macos/build/*.zip macos/build/*.pkg; do shasum -a 256 "$f" | awk '{print $1}' > "$f.sha256"; done
          if [[ "$PRE" == "true" ]]; then
            gh release delete "$TAG" -y --cleanup-tag 2>/dev/null || true
            gh release create "$TAG" macos/build/*.pkg macos/build/*.dmg macos/build/*.zip macos/build/*.sha256 --title "Task Hub na Maca (budowa $VERSION)" --notes-file macos/out/notes.md --prerelease --target "$GITHUB_SHA"
          elif gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" macos/build/*.pkg macos/build/*.dmg macos/build/*.zip macos/build/*.sha256 --clobber
            gh release edit "$TAG" --title "Task Hub na Maca $VERSION" --notes-file macos/out/notes.md --prerelease=false --latest
          else
            gh release create "$TAG" macos/build/*.pkg macos/build/*.dmg macos/build/*.zip macos/build/*.sha256 --title "Task Hub na Maca $VERSION" --notes-file macos/out/notes.md --latest --target "$GITHUB_SHA"
          fi
