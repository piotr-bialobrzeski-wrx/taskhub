# Test dymny produkcji: po każdym udanym wdrożeniu produkcyjnym na Vercelu (zdarzenie deployment_status), ręcznie (workflow_dispatch)
# albo po zmianie tego pliku runner GitHuba odpytuje stały adres aplikacji i zapisuje wynik jako komentarz do commita
# (sesje w chmurze nie dosięgają vercel.app; wynik czytają przez `gh api repos/<repo>/commits/<sha>/comments`).
name: Diagnostyka produkcji
on:
  workflow_dispatch:
  deployment_status:
  push:
    branches: [main]
    paths: [".github/workflows/diag.yml"]
permissions:
  contents: write
jobs:
  diag:
    if: github.event_name != 'deployment_status' || (github.event.deployment_status.state == 'success' && github.event.deployment.environment == 'Production')
    runs-on: ubuntu-latest
    steps:
      - name: Zapytaj produkcję
        shell: bash
        run: |
          set +e
          if [ "${{ github.event_name }}" = deployment_status ]; then sleep 20; fi
          B=https://taskhub-lac.vercel.app
          INIT='{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-03-26","capabilities":{},"clientInfo":{"name":"diag","version":"0"}}}'
          code() { curl -sS -m 25 -o body.txt -w '%{http_code}' "$@" 2>body.txt; }
          {
            echo "## Diagnostyka produkcji ($(date -u +%Y-%m-%dT%H:%M:%SZ), ${{ github.event_name }})"
            echo
            for u in "$B/api/health" "$B/.well-known/oauth-protected-resource/api/mcp" "$B/.well-known/oauth-authorization-server" "$B/login"; do
              c=$(code "$u"); echo "- GET \`${u#$B}\` → **$c** \`$(head -c 160 body.txt | tr '\n' ' ')\`"
            done
            c=$(code -X POST "$B/api/mcp" -H 'content-type: application/json' -H 'accept: application/json, text/event-stream' -d "$INIT")
            echo "- POST \`/api/mcp\` bez tokenu → **$c** (oczekiwane 401) \`$(head -c 200 body.txt | tr '\n' ' ')\`"
            c=$(code -X POST "$B/api/mcp" -H 'authorization: Bearer th_zly' -H 'content-type: application/json' -H 'accept: application/json, text/event-stream' -d "$INIT")
            echo "- POST \`/api/mcp\` ze złym tokenem → **$c** (oczekiwane 401)"
            c=$(code "$B/api/bridge/work"); echo "- GET \`/api/bridge/work\` bez tokenu → **$c** (oczekiwane 401)"
          } > out.md
          cat out.md
      - name: Wynik jako komentarz do commita
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SHA="${{ github.event.deployment.sha || github.sha }}"
          gh api "repos/${{ github.repository }}/commits/$SHA/comments" -F body=@out.md --silent
